<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | InfoTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #3859f2;
      --accent: #f27340;
      --dark: #0f121f;
      --gray-600: #666b7a;
      --gray-100: #f5f6f8;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--gray-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      font-weight: 700;
      font-size: 22px;
      color: var(--primary);
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--gray-600);
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--dark);
    }

    input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #e2e4ea;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--gray-600);
    }

    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .msg {
      margin-top: 12px;
      min-height: 18px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      color: var(--gray-600);
    }

    .msg.bad {
      color: #d43f3f;
    }

    .back {
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray-600);
    }

    .back a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">InfoTech ⚡</div>
    <p class="subtitle">Área do aluno — faça login para continuar</p>

    <form id="loginForm" novalidate>
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="seu_usuario" autocomplete="username" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required />

      <button type="submit" class="btn" id="loginBtn">Entrar</button>
      <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      <a href="#">Esqueci minha senha</a>
    </div>
  </div>

  <p class="back">
    <a href="index.html">← Voltar para a página inicial</a>
  </p>

  <script>
    const API_BASE = "https://curso-jogos-prog.onrender.com";
    const PLATFORM_URL = API_BASE + "/cursos.html";

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = document.getElementById("loginMsg");
      const btn = document.getElementById("loginBtn");
      const username = document.getElementById("usuario").value.trim();
      const password = document.getElementById("senha").value;

      if (!username || !password) {
        msg.className = "msg bad";
        msg.textContent = "Informe usuário e senha.";
        return;
      }

      msg.className = "msg";
      msg.textContent = "Entrando...";
      btn.disabled = true;

      try {
        const res = await fetch(API_BASE + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({ error: "Resposta inválida do servidor." }));
        if (!res.ok) throw new Error(data.error || "Não foi possível entrar.");
        location.href = PLATFORM_URL + "#token=" + encodeURIComponent(data.token);
      } catch (err) {
        msg.className = "msg bad";
        msg.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
