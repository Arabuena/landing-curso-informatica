<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | InfoTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #3859f2;
      --accent: #f27340;
      --dark: #0f121f;
      --gray-600: #666b7a;
      --gray-100: #f5f6f8;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--gray-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      font-weight: 700;
      font-size: 22px;
      color: var(--primary);
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--gray-600);
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--dark);
    }

    input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #e2e4ea;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--gray-600);
    }

    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .back {
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray-600);
    }

    .back a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">InfoTech ⚡</div>
    <p class="subtitle">Área do aluno — faça login para continuar</p>

    <form action="#" method="post" onsubmit="event.preventDefault(); alert('Login em desenvolvimento. Em breve você poderá acessar suas aulas por aqui!');">
      <label for="email">E-mail ou matrícula</label>
      <input type="text" id="email" name="email" placeholder="seu@email.com" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required />

      <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="links">
      <a href="#">Esqueci minha senha</a>
    </div>
  </div>

  <p class="back">
    <a href="index.html">← Voltar para a página inicial</a>
  </p>

</body>
</html>
